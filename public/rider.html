<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087b4d"><title>Sarkar Rider App</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f6;font-family:Arial,"Noto Sans Bengali",sans-serif;color:#17251e}.wrap{max-width:760px;margin:auto;padding:16px 12px 90px}h1{font-size:26px;margin:6px 0}.card{background:#fff;border:1px solid #dce9e2;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 8px 24px #06351c0d}input,button{width:100%;padding:13px;border-radius:12px;margin:5px 0;border:1px solid #d4e2db;font:inherit}button{background:#087b4d;color:#fff;border:0;font-weight:900;cursor:pointer}.secondary{background:#edf5f1;color:#176044;border:1px solid #cfe1d8}.red{background:#a53127}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.top button{width:auto;padding:9px 12px;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f4f8f6;border-radius:13px;padding:11px;text-align:center}.stat b{display:block;font-size:20px}.muted{color:#6d7a73;font-size:12px}.hidden{display:none}.order{border:1px solid #dce9e2;border-radius:15px;padding:13px;margin:10px 0}.orderhead{display:flex;justify-content:space-between;gap:8px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#fff1cf;color:#8a5a00;font-size:11px;font-weight:900}.badge.go{background:#dff7e9;color:#087b4d}.map{background:#f0f7f3;padding:10px;border-radius:11px;margin-top:9px;font-size:13px}.items{margin-top:8px;padding:8px;background:#fafcfb;border-radius:10px;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.actions button{margin:0}.full{grid-column:1/-1}.loginbox{text-align:center;padding-top:28px}.loginbox h2{margin-bottom:6px}.switch{display:flex;align-items:center;gap:9px;background:#f1f7f4;border-radius:12px;padding:10px;margin-top:8px}.switch input{width:auto;margin:0}.gps{display:flex;align-items:center;gap:8px}.empty{text-align:center;padding:35px 10px}.toast{position:fixed;left:12px;right:12px;bottom:15px;background:#17251e;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:20}
</style></head><body><main class="wrap">
<section id="login" class="card loginbox"><div style="font-size:46px">🛵</div><h2>SARKAR Rider App</h2><p class="muted">মোবাইল ও password দিয়ে login করুন</p><input id="phone" placeholder="মোবাইল নম্বর" inputmode="tel"><input id="password" placeholder="Password" type="password"><button onclick="login()">Login</button></section>
<section id="app" class="hidden"><div class="card"><div class="top"><div><h1>🛵 Rider Dashboard</h1><div id="riderName" class="muted"></div></div><button class="red" onclick="logout()">Logout</button></div><div class="stats" style="margin-top:12px"><div class="stat"><b id="readyCount">0</b><span class="muted">নতুন</span></div><div class="stat"><b id="activeCount">0</b><span class="muted">Delivery</span></div><div class="stat"><b id="todayCount">0</b><span class="muted">মোট</span></div></div><div class="switch"><input id="onlineToggle" type="checkbox" onchange="setOnline(this.checked)"><label for="onlineToggle"><b id="onlineText">Online</b> — নতুন order automatic আসবে</label></div><p id="gps" class="muted gps">📍 Live GPS চালু হচ্ছে…</p><button class="secondary" onclick="loadOrders(true)">🔄 Refresh Orders</button></div><div id="orders"></div></section>
</main><div id="toast" class="toast"></div><script>
let token=localStorage.getItem('riderSession'),poll=null,gpsWatch=null,lastIds=new Set(),firstLoad=true;const $=id=>document.getElementById(id);
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(r.status===401){forceLogout();throw Error(d.error||'Login required')}if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){try{const r=await fetch('/api/auth/rider/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:$('phone').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');localStorage.setItem('riderSession',d.token);token=d.token;show();await loadMe();await loadOrders(true);startGPS();notifyPermission();startPolling()}catch(e){toast(e.message)}}
function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}
async function logout(){try{if(token)await fetch('/api/auth/rider/logout',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}})}catch{}forceLogout()}
function forceLogout(){stopGPS();if(poll)clearInterval(poll);localStorage.removeItem('riderSession');token='';location.reload()}
async function loadMe(){const d=await api('/api/rider/me');$('riderName').textContent=d.name+' · '+d.phone;$('onlineToggle').checked=!!d.online;$('onlineText').textContent=d.online?'Online':'Offline'}
async function setOnline(v){try{const d=await api('/api/rider/availability',{method:'PATCH',body:JSON.stringify({online:v})});$('onlineToggle').checked=!!d.online;$('onlineText').textContent=d.online?'Online':'Offline';toast(d.online?'আপনি Online — নতুন order আসবে':'আপনি Offline');if(d.online)loadOrders(true)}catch(e){$('onlineToggle').checked=!v;toast(e.message)}}
async function loadOrders(manual=false){try{const list=await api('/api/rider/orders');const newIds=list.filter(o=>o.status==='READY').map(o=>o.id).filter(id=>!lastIds.has(id));if(!firstLoad&&!manual&&newIds.length)notifyNew(newIds.length);firstLoad=false;lastIds=new Set(list.map(o=>o.id));render(list)}catch(e){if(manual)toast(e.message)}}
function render(list){const ready=list.filter(o=>o.status==='READY').length,active=list.filter(o=>o.status==='OUT_FOR_DELIVERY').length;$('readyCount').textContent=ready;$('activeCount').textContent=active;$('todayCount').textContent=list.length;if(!list.length){$('orders').innerHTML='<div class="card empty"><div style="font-size:42px">📦</div><b>এখন কোনো order নেই</b><p class="muted">Admin Ready করলে বা আপনি Online হলে order এখানে automatic আসবে।</p></div>';return}$('orders').innerHTML=list.map(o=>{const items=parseItems(o.items);const badge=o.status==='OUT_FOR_DELIVERY'?'<span class="badge go">🚚 Delivery চলছে</span>':'<span class="badge">🆕 নতুন Order</span>';return `<div class="order"><div class="orderhead"><div><b>#${esc(o.id)}</b><div class="muted">${fmt(o.createdAt)}</div></div>${badge}</div><h3 style="margin:9px 0 5px">${esc(o.name)} · ${esc(o.phone)}</h3><div class="map">📍 ${esc(o.address||'ঠিকানা নেই')} ${o.customerLat!=null&&o.customerLon!=null?'· GPS available':''}</div>${items?`<div class="items">${items}</div>`:''}<div style="margin-top:8px"><b>₹${Number(o.total||0).toFixed(0)}</b> · ${esc(o.paymentMethod||'COD')}</div><div class="actions"><button class="secondary" onclick="callCustomer('${esc(o.phone)}')">📞 Call</button><button class="secondary" onclick="goMap(${o.customerLat},${o.customerLon})">🗺️ Map</button>${o.status==='READY'?`<button class="full" onclick="status('${o.id}','OUT_FOR_DELIVERY')">🚚 Start Delivery</button>`:`<button class="full" onclick="status('${o.id}','DELIVERED')">✅ Delivered</button>`}</div></div>`}).join('')}
async function status(id,s){try{await api('/api/rider/orders/'+encodeURIComponent(id)+'/status',{method:'PATCH',body:JSON.stringify({status:s})});toast(s==='DELIVERED'?'Order Delivered':'Delivery Started');await loadOrders(true)}catch(e){toast(e.message)}}
function goMap(lat,lon){if(lat==null||lon==null)return toast('Customer GPS পাওয়া যায়নি');location.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(lat+','+lon)}
function callCustomer(phone){location.href='tel:'+phone}
function parseItems(v){try{const a=Array.isArray(v)?v:JSON.parse(v||'[]');return a.map(x=>`${esc(x.name||x.title||'Item')} × ${Number(x.qty||x.quantity||1)}`).join(' · ')}catch{return ''}}
function fmt(v){try{return new Date(v).toLocaleString('bn-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch{return ''}}
function startPolling(){if(poll)clearInterval(poll);poll=setInterval(()=>{if(token)loadOrders(false)},5000)}
function startGPS(){if(!navigator.geolocation){$('gps').textContent='⚠️ এই device-এ GPS নেই';return}if(gpsWatch!==null)return;gpsWatch=navigator.geolocation.watchPosition(async p=>{ $('gps').textContent=`📍 Live GPS চলছে · ±${Math.round(p.coords.accuracy||0)}m`;let list=[];try{list=await api('/api/rider/orders')}catch{return}for(const o of list.filter(x=>x.status==='OUT_FOR_DELIVERY')){try{await api('/api/rider/location',{method:'POST',body:JSON.stringify({orderId:o.id,latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy})})}catch{}}},()=>{$('gps').textContent='⚠️ GPS permission দিন'},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
function stopGPS(){if(gpsWatch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null}
function notifyPermission(){if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{})}
function notifyNew(n){if('Notification'in window&&Notification.permission==='granted'){try{new Notification('SARKAR Restaurant',{body:n+'টি নতুন delivery order এসেছে 🛵'})}catch{}}toast('🔔 নতুন order এসেছে')}
function toast(s){const x=$('toast');x.textContent=s;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',2800)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
if(token){show();loadMe().then(()=>loadOrders(true)).catch(()=>{});startGPS();notifyPermission();startPolling()}
</script></body></html>
