services:
  - type: web
    name: sarkar-restaurant
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sarkar-restaurant-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: https://sarkar-restaurant.onrender.com

databases:
  - name: sarkar-restaurant-db
    plan: free
